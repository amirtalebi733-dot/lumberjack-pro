<!doctype html><n<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#bcecf4"><title>LumberJack Pro</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:Tahoma,Arial;background:#bdebf4;touch-action:manipulation}#game{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;background:linear-gradient(#bdebf4 0 76%,#d7f3c0 76%);position:relative}header{height:65px;display:flex;align-items:center;justify-content:space-between;padding:8px 18px;color:#704c29;font-weight:bold}.num{font-size:22px}#scene{position:relative;flex:1;overflow:hidden}canvas{width:100%;height:100%;display:block}#hint{position:absolute;top:10px;left:0;right:0;text-align:center;color:#76522d;font-weight:bold;text-shadow:0 1px white;font-size:13px;pointer-events:none}#controls{display:flex;justify-content:center;gap:34px;padding:15px 12px calc(18px + env(safe-area-inset-bottom));background:#fffdf6}.btn{width:min(31vw,135px);height:min(31vw,135px);border-radius:50%;border:7px solid #edc78e;background:radial-gradient(circle at 35% 25%,#fff0cf,#d9a966);box-shadow:0 6px #a8753e;color:#96662e;font-size:44px;font-weight:bold}.btn:active{transform:translateY(4px);box-shadow:0 2px #a8753e}#cover{position:absolute;inset:0;background:#173b3b99;display:flex;align-items:center;justify-content:center;padding:22px;z-index:3}.panel{background:#fff7e7;border:5px solid #b9864a;border-radius:24px;padding:24px 20px;text-align:center;color:#684522;width:min(100%,340px);box-shadow:0 8px #80572e}.panel h2{margin:0 0 10px}.panel p{font-size:14px;line-height:1.9}#play{border:0;border-radius:13px;background:#a8d66e;color:#38531e;font-weight:bold;font-size:18px;padding:13px 30px;box-shadow:0 4px #719b42}.sub{font-size:11px;color:#98764c;margin-top:12px}
</style></head><body><main id="game"><header><div>امتیاز<br><span class="num" id="score">۰</span></div><div style="text-align:center">LumberJack Pro<br><small id="clock">۳۰ ثانیه</small></div><div style="text-align:left">رکورد<br><span class="num" id="best">۰</span></div></header><section id="scene"><canvas id="cv"></canvas><div id="hint">شاخه‌ها فقط سمت راست هستند!</div></section><section id="controls"><button class="btn" id="left">⬅</button><button class="btn" id="right">➡</button></section><div id="cover"><div class="panel"><h2>🌳 LumberJack Pro</h2><p>درخت را قطع کن و رکورد بزن!<br>شاخه‌ها فقط سمت راست هستند.<br>برای زنده ماندن، سمت چپ را بزن.</p><button id="play">شروع بازی</button><div class="sub">نسخه آزمایشی مخصوص تلگرام</div></div></div></main><script>
(()=>{const c=document.querySelector('#cv'),x=c.getContext('2d'),$=id=>document.getElementById(id);let w,h,d=1,score=0,best=+(localStorage.ljprobest||0),time=30,active=false,raf=0,last=0,side='left',impact=0,particles=[];const fa=n=>Math.floor(n).toString().replace(/\d/g,a=>'۰۱۲۳۴۵۶۷۸۹'[a]);$('best').textContent=fa(best);function size(){let r=c.getBoundingClientRect();d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);paint()}new ResizeObserver(size).observe(c);function rr(a,b,z,t,r,col){x.fillStyle=col;x.beginPath();x.roundRect(a,b,z,t,r);x.fill()}function drawCloud(a,b,s){x.save();x.translate(a,b);x.scale(s,s);x.fillStyle='#effcff';x.beginPath();x.arc(0,10,18,0,7);x.arc(20,0,25,0,7);x.arc(45,10,18,0,7);x.roundRect(-15,8,78,22,12);x.fill();x.restore()}function tree(){let cx=w/2,top=h*.08,base=h*.91,tw=Math.min(w*.17,78),g=x.createLinearGradient(cx-tw/2,0,cx+tw/2,0);g.addColorStop(0,'#80552c');g.addColorStop(.25,'#bd914f');g.addColorStop(.75,'#a8793d');g.addColorStop(1,'#754b27');rr(cx-tw/2,top,tw,base-top,15,g);rr(cx-tw*.2,top+h*.1,tw*.12,h*.23,7,'#80582e');rr(cx+tw*.14,top+h*.42,tw*.15,h*.2,8,'#81582e');for(let i=0;i<5;i++){let yy=top+h*(.12+i*.145);let len=Math.min(w*.3,145),sx=cx+tw*.35;x.fillStyle='#885d2d';x.beginPath();x.moveTo(sx,yy+5);x.lineTo(sx+len,yy+5);x.lineTo(sx+len,yy-10);x.lineTo(sx+len-12,yy-10);x.lineTo(sx+len-12,yy-1);x.lineTo(sx,yy-1);x.fill();let lx=sx+len-8;x.fillStyle='#76a947';x.beginPath();x.ellipse(lx,yy-25,40,18,0,0,7);x.ellipse(lx+20,yy-18,30,14,0,0,7);x.ellipse(lx-20,yy-17,29,14,0,0,7);x.fill();x.fillStyle='#a6d66c';x.beginPath();x.ellipse(lx-4,yy-31,20,13,0,0,7);x.fill()}}function man(){let px=side==='left'?w*.24:w*.72,py=h*.72;x.save();x.translate(px,py);rr(-17,55,12,30,3,'#304b72');rr(5,55,12,30,3,'#304b72');rr(-22,80,21,8,3,'#242b2b');rr(2,80,21,8,3,'#242b2b');rr(-25,4,50,55,9,'#c43c2d');x.fillStyle='#e27453';x.fillRect(-3,8,6,47);x.fillStyle='#efbd91';x.beginPath();x.arc(0,-12,20,0,7);x.fill();rr(-22,-32,44,9,4,'#293a39');rr(-14,-39,29,10,4,'#293a39');x.fillStyle='#252525';x.beginPath();x.arc(-7,-13,2,0,7);x.arc(7,-13,2,0,7);x.fill();x.save();x.translate(20,25);x.rotate(impact?-.9:.35);rr(-3,-30,6,45,3,'#79502a');rr(-4,-34,22,13,4,'#cbd4d2');x.restore();x.restore()}function paint(){if(!w)return;x.clearRect(0,0,w,h);let sky=x.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#b8edf5');sky.addColorStop(1,'#e3faf7');x.fillStyle=sky;x.fillRect(0,0,w,h);drawCloud(w*.16,h*.16,1);drawCloud(w*.8,h*.28,.8);x.fillStyle='#b9e5d3';x.beginPath();x.moveTo(0,h*.77);x.quadraticCurveTo(w*.25,h*.63,w*.5,h*.76);x.quadraticCurveTo(w*.78,h*.64,w,h*.76);x.lineTo(w,h);x.lineTo(0,h);x.fill();x.fillStyle='#a5d879';x.fillRect(0,h*.87,w,h*.13);x.fillStyle='#8e6445';x.fillRect(0,h*.96,w,h*.04);tree();man();particles.forEach(p=>{x.save();x.translate(p.x,p.y);x.rotate(p.a);rr(-4,-2,8,4,2,'#d8a35d');x.restore()})}function start(){score=0;time=30;side='left';active=true;particles=[];$('score').textContent='۰';$('clock').textContent='۳۰ ثانیه';$('cover').style.display='none';last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function loop(t){if(!active)return;let dt=Math.min((t-last)/1000,.05);last=t;time-=dt;$('clock').textContent=fa(Math.ceil(Math.max(0,time)))+' ثانیه';particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.a+=.1;p.life--});particles=particles.filter(p=>p.life>0);impact=Math.max(0,impact-dt*4);paint();if(time<=0){end('زمان تمام شد!');return}raf=requestAnimationFrame(loop)}function chop(s){if(!active)return;if(s==='right'){end('به شاخه برخورد کردی!');return}side='left';score++;$('score').textContent=fa(score);if(score>best){best=score;localStorage.ljprobest=best;$('best').textContent=fa(best)}impact=.25;for(let i=0;i<9;i++)particles.push({x:w/2+(Math.random()-.5)*20,y:h*.5,vx:(Math.random()-.5)*5,vy:-Math.random()*4,life:25,a:0});paint()}function end(msg){active=false;cancelAnimationFrame(raf);$('cover').style.display='flex';$('cover').querySelector('h2').textContent=msg;$('cover').querySelector('p').innerHTML='امتیاز: <b>'+fa(score)+'</b><br>رکورد: <b>'+fa(best)+'</b>'; $('play').textContent='بازی دوباره'}$('left').onpointerdown=e=>{e.preventDefault();if(!active)start();else chop('left')};$('right').onpointerdown=e=>{e.preventDefault();chop('right')};$('play').onclick=start;window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')active?chop('left'):start();if(e.key==='ArrowRight')chop('right')});try{let tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();tg.setHeaderColor('#bcecf4');tg.setBackgroundColor('#bcecf4')}}catch(e){}size()})();
</script></body></html>
